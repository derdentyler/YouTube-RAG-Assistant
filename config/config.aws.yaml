language: "ru"
use_langchain: false

models:
  ru:
    backend: "llama.cpp"
    model_path: "/app/models/llm/saiga_llama3_8b-q4_k_m.gguf"
    n_ctx: 8192
  en:
    backend: "transformers"
    model_name: "mistralai/Mistral-7B-Instruct-v0.1"

embedding_model: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
embedding_dimension: 768

retriever:
  top_k: 6
  similarity_metric: "cosine"

reranker:
  use_reranker: false
  top_k: 3
  model_path: "/app/models/reranker/logreg_reranker.pkl"

chunking:
  method: "semantic"
  max_tokens: 150
  similarity_threshold: 0.7
  min_chunk_size: 50

subtitle_block_duration: 60
subtitle_block_overlap: 10

aws:
  enabled: true
  region: "us-east-1"
  s3_bucket: "${S3_BUCKET}"
  s3_prefix: "subtitles/"
  use_rds: true
  rds_host: "${RDS_HOST}"
  rds_port: 5432
  rds_database: "${RDS_DATABASE}"
  rds_user: "${RDS_USER}"

