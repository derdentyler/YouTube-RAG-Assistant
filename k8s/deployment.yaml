apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-rag-api
  namespace: video-rag
  labels:
    app: video-rag-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-rag-api
  template:
    metadata:
      labels:
        app: video-rag-api
    spec:
      containers:
        - name: video-rag-api
          image: video-rag-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: video-rag-env
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            - name: models-volume
              mountPath: /app/models
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: config-volume
          configMap:
            name: video-rag-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: models-volume
          persistentVolumeClaim:
            claimName: video-rag-models-pvc
      restartPolicy: Always

