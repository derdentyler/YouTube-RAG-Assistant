apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder-service
  namespace: video-rag
  labels:
    app: embedder-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: embedder-service
  template:
    metadata:
      labels:
        app: embedder-service
    spec:
      containers:
        - name: embedder-service
          image: rag-embedder-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
      volumes:
        - name: config-volume
          configMap:
            name: video-rag-config
---
apiVersion: v1
kind: Service
metadata:
  name: embedder-service
  namespace: video-rag
spec:
  selector:
    app: embedder-service
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
      name: http

