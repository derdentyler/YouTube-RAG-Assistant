apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-service
  namespace: video-rag
  labels:
    app: llm-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-service
  template:
    metadata:
      labels:
        app: llm-service
    spec:
      containers:
        - name: llm-service
          image: rag-llm-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"
          volumeMounts:
            - name: models-volume
              mountPath: /app/models
              readOnly: true
            - name: config-volume
              mountPath: /app/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: models-volume
          persistentVolumeClaim:
            claimName: video-rag-models-pvc
        - name: config-volume
          configMap:
            name: video-rag-config
---
apiVersion: v1
kind: Service
metadata:
  name: llm-service
  namespace: video-rag
spec:
  selector:
    app: llm-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
      name: http

