apiVersion: v1
kind: Service
metadata:
  name: video-rag-api-service
  namespace: video-rag
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: video-rag-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      name: http
