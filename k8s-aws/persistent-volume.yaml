apiVersion: v1
kind: PersistentVolume
metadata:
  name: video-rag-models-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gp3
  awsElasticBlockStore:
    volumeID: <YOUR_EBS_VOLUME_ID>
    fsType: ext4
